# prh rules for this blog.
#
# The rule set is inlined from prh-rules (MIT License), originally maintained
# for WEB+DB PRESS:
#
#   https://github.com/prh/rules
#   node_modules/prh/prh-rules/media/WEB+DB_PRESS.yml
#
# It used to be pulled in with "imports" and then patched from this file, but
# prh's import merge only drops an upstream rule when a local rule declares the
# same "expected". That forced a dummy no-op rule in front of every real
# override, which made the file hard to read. The rules now live here in full
# and the handful of deviations are edited in place, each marked with "LOCAL:".
#
# Regenerating from a newer upstream means re-applying those LOCAL edits.

version: 1

rules:
